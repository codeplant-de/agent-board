name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm --filter @agent-board/cli build

      - name: Binary smoke test
        run: pnpm --filter @agent-board/cli test:binary

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/cli/dist/board-linux-x64 \
            apps/cli/dist/board-linux-arm64 \
            apps/cli/dist/board-darwin-arm64 \
            apps/cli/dist/SHA256SUMS \
            scripts/install.sh \
            --title "board $GITHUB_REF_NAME" \
            --generate-notes
