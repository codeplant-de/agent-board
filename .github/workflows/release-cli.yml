name: Release CLI

# Called by ci.yml after a merge to main, or started by hand to retry a failed release of the main head. Either way it
# releases apps/cli/package.json's version at the checked-out commit, and only from main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The macOS binary is built where it runs, and the smoke tests run on that very file before it is published.
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the macOS binary
        run: pnpm --filter @agent-board/cli build darwin-arm64

      - name: Binary smoke test
        run: BOARD_BINARY="$PWD/apps/cli/dist/board-darwin-arm64" pnpm --filter @agent-board/cli test:binary

      - name: macOS smoke test
        run: apps/cli/scripts/macos-smoke.sh apps/cli/dist/board-darwin-arm64

      - name: Hand the binary to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-darwin-arm64
          path: apps/cli/dist/board-darwin-arm64
          if-no-files-found: error

  release:
    needs: macos
    runs-on: ubuntu-latest
    # Two pushes to main never publish at once: the second run then finds the release published and skips.
    concurrency:
      group: cli-release
      cancel-in-progress: false

    steps:
      # Full history, for the tags; no credential is left in the checkout, only the steps that call gh get a token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "releases are made from main only, this run is on $GITHUB_REF" >&2
            exit 1
          fi
          version=$(node -p "require('./apps/cli/package.json').version")
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "apps/cli/package.json version $version is not x.y.z" >&2
            exit 1
          fi
          tag="cli-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A missing release is not released; a draft is a failed earlier run.
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = false ]; then
            echo "$tag is already published, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          newest=$(git tag --list 'cli-v*' | grep -E '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^cli-v//' | sort -V | tail -n 1)
          if [ -n "$newest" ]; then
            highest=$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)
            if [ "$version" = "$newest" ] || [ "$highest" != "$version" ]; then
              echo "apps/cli/package.json version $version is not above the newest release cli-v$newest" >&2
              exit 1
            fi
          fi

      # The completion tests parse the zsh and fish scripts with the real shells and fail without them on CI.
      - name: Install zsh and fish
        if: steps.version.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install dependencies
        if: steps.version.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.version.outputs.skip == 'false'
        run: pnpm typecheck

      - name: Lint
        if: steps.version.outputs.skip == 'false'
        run: pnpm lint

      - name: Format
        if: steps.version.outputs.skip == 'false'
        run: pnpm format:check

      # The backend integration tests need the Postgres service of ci.yml, which this job does not have.
      - name: Tests
        if: steps.version.outputs.skip == 'false'
        run: pnpm --filter "@agent-board/cli..." test

      # The Linux binaries are built here; the macOS one comes from the macos job, which ran it, and the checksums cover all three.
      - name: Build
        if: steps.version.outputs.skip == 'false'
        run: pnpm --filter @agent-board/cli build linux-x64 linux-arm64

      - name: Fetch the macOS binary
        if: steps.version.outputs.skip == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: board-darwin-arm64
          path: apps/cli/dist

      - name: Checksums
        if: steps.version.outputs.skip == 'false'
        run: |
          cd apps/cli/dist
          chmod +x board-darwin-arm64
          sha256sum board-* > SHA256SUMS
          cat SHA256SUMS

      - name: Binary smoke test
        if: steps.version.outputs.skip == 'false'
        run: pnpm --filter @agent-board/cli test:binary

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="cli-v$VERSION"
          # A draft is left by a failed run; it has no tag, so removing it leaves nothing behind.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "board $tag" --generate-notes
          gh release upload "$tag" \
            apps/cli/dist/board-linux-x64 \
            apps/cli/dist/board-linux-arm64 \
            apps/cli/dist/board-darwin-arm64 \
            apps/cli/dist/SHA256SUMS \
            scripts/install.sh
          gh release edit "$tag" --draft=false
