name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U board -d board_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Backend integration tests reset this database's schema and run all migrations.
      TEST_DATABASE_URL: postgresql://board:board@localhost:5432/board_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
