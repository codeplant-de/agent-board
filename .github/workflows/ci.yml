name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U board -d board_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Backend integration tests reset this database's schema and run all migrations.
      TEST_DATABASE_URL: postgresql://board:board@localhost:5432/board_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The completion tests parse the zsh and fish scripts with the real shells and fail without them on CI.
      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # caddyfile.docker.test.ts runs the Caddyfile in the Caddy image the web container ships, and fails on CI without it.
      - name: Pull the Caddy image
        run: docker pull "$(sed -n 's/^ARG CADDY_IMAGE=//p' apps/frontend/Dockerfile)"

      - name: Tests
        run: pnpm test

  # The released binary runs on Bun while the tests run on Node, so a pull request builds one and runs it. Its own job:
  # a Bun download problem must not hold back the image push.
  binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI binary
        run: pnpm --filter @agent-board/cli build

      - name: Binary smoke test
        run: pnpm --filter @agent-board/cli test:binary

  # Whether a change reaches what runs on a worker's Mac. No third-party action: the paths are compared with git.
  macos-changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.paths.outputs.cli }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the CLI, the shared package or a workflow change
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only a pull request is compared; a push to main or a manual run always runs the macOS job.
          if [ "$EVENT" != pull_request ]; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(apps/cli/|packages/shared/|\.github/workflows/|pnpm-lock\.yaml$|package\.json$|pnpm-workspace\.yaml$|\.nvmrc$|mise\.toml$)'; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
          fi

  # The worker runs on macOS too (launchd agents, detached worker processes), so the CLI is tested and its binary built and
  # run there. The runners are free for a public repository. The backend tests need Postgres and stay on Linux.
  cli-macos:
    needs: macos-changes
    if: needs.macos-changes.outputs.cli == 'true'
    runs-on: macos-latest
    # GitHub's macOS runners are sometimes short, and a job no runner picks up within about 15 minutes is cancelled. On a
    # pull request that must not turn the run red: the job is not a required check and a failure here shows on the job
    # only. On main it stays blocking, since cli-release waits for it.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The completion tests parse the zsh and fish scripts with the real shells; zsh ships with macOS.
      - name: Install fish
        run: brew install fish

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI tests
        run: pnpm --filter "@agent-board/cli..." test

      - name: Build the CLI binary
        run: pnpm --filter @agent-board/cli build darwin-arm64

      - name: Binary smoke test
        run: pnpm --filter @agent-board/cli test:binary

      - name: macOS smoke test
        run: apps/cli/scripts/macos-smoke.sh apps/cli/dist/board-darwin-arm64

  # A change that raises MIN_CLIENT above the newest release makes that CLI fail against the server, so it must come
  # with a higher CLI version. The rollout order is the "Upgrading" list in docs/setup.md. A required check; the gate of
  # cli-release-plan on main stops a break that lands anyway.
  cli-release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # Full history and the cli-v* tags: the script compares MIN_CLIENT at HEAD with the newest cli-v* tag, and the version with that tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the CLI version against MIN_CLIENT
        run: scripts/check-cli-release.sh

  # On main: the gate stops a merged break without a CLI version bump before it reaches Flux, and the plan says whether the
  # package version has a published release yet.
  cli-release-plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate
        run: scripts/check-cli-release.sh

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version apps/cli/package.json)
          draft=$(gh release view "cli-v$version" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = false ]; then
            echo "cli-v$version is published"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "cli-v$version has no published release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # A CLI version without a published release is released here, from the commit under test.
  cli-release:
    needs: [test, cli-release-plan, cli-macos]
    if: >-
      !cancelled() && needs.cli-release-plan.outputs.release == 'true' && needs.test.result == 'success'
      && needs.cli-release-plan.result == 'success' && needs.cli-macos.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release-cli.yml

  # The newest released CLI must keep working against this commit's server, unless MIN_CLIENT is above it (a declared
  # break). It adds and reads tasks, schedules and notes, runs a real dispatch tick with stubbed systemd-run and claude, and
  # holds the event stream open.
  previous-cli:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board_prevcli
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U board -d board_prevcli"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Is a break declared
        id: declared
        run: |
          if scripts/check-cli-release.sh release-behind; then
            echo "MIN_CLIENT is above the newest release: it is expected to fail, the previous-cli check is skipped"
            echo "raised=true" >> "$GITHUB_OUTPUT"
          else
            echo "raised=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.declared.outputs.raised == 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        if: steps.declared.outputs.raised == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.declared.outputs.raised == 'false'
        run: pnpm install --frozen-lockfile

      - name: Download the newest released CLI
        if: steps.declared.outputs.raised == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag the script compares with: the newest strict cli-v<x.y.z>. Its release must be published, or this fails.
          tag=$(git tag --list 'cli-v*' | grep -E '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          [ -n "$tag" ] || { echo "no cli-v* tag found" >&2; exit 1; }
          echo "previous CLI: $tag"
          gh release view "$tag" >/dev/null 2>&1 || { echo "$tag is not published as a release yet" >&2; exit 1; }
          mkdir "$RUNNER_TEMP/previous-cli"
          gh release download "$tag" -p board-linux-x64 -D "$RUNNER_TEMP/previous-cli"
          chmod +x "$RUNNER_TEMP/previous-cli/board-linux-x64"

      - name: Previous CLI smoke test
        if: steps.declared.outputs.raised == 'false'
        env:
          DATABASE_URL: postgresql://board:board@localhost:5432/board_prevcli
        run: scripts/run-previous-cli-smoke.sh "$RUNNER_TEMP/previous-cli/board-linux-x64"

  # A pull request builds every image without pushing it, so a break only the image build sees (a file a Dockerfile must
  # COPY, a lockfile the filtered install rejects, an import Vite cannot resolve but tsc accepts) fails here, not after the
  # merge, where build-and-push would fail quietly and Flux would keep the old image. It reads the cache build-and-push
  # writes on main and writes none: a pull request's cache entries are visible only to that pull request and would push
  # main's out of the repository's cache quota.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent-board-backend
            dockerfile: apps/backend/Dockerfile
          - image: agent-board-web
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}

  # Images are built only after the tests and the previous-CLI smoke test pass, so Flux never rolls out a commit that failed
  # them. A declared break skips previous-cli's steps and the job still succeeds, so only a red run blocks. A failed release
  # download is red too and holds the push until a rerun. On every CLI version bump the images also wait for the release, so
  # a machine told to update (the backend advertises CLI_VERSION) finds it; a failed release holds them until it is retried.
  # They wait on the release's published output, not on the call's result: a macOS attempt that got no runner can leave the
  # call failed even when the retry released.
  build-and-push:
    needs: [test, previous-cli, cli-release-plan, cli-release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.test.result == 'success' && needs.previous-cli.result == 'success'
      && needs.cli-release-plan.result == 'success'
      && (needs.cli-release-plan.outputs.release != 'true' || needs.cli-release.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing image must not cancel the others, or a web build could stop the backend deploy.
      fail-fast: false
      matrix:
        include:
          - image: agent-board-backend
            dockerfile: apps/backend/Dockerfile
          - image: agent-board-web
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sortable tag for Flux image automation in codeplant-de/cloud-infra: Flux can't order SHAs,
      # so the commit time goes last. Commit time rather than build time keeps it stable on reruns.
      - name: Image tag
        id: tag
        run: echo "tag=main-${GITHUB_SHA::8}-$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # The backend advertises it to the machines, so they learn that a newer CLI exists.
      - name: CLI version
        id: cli
        run: echo "version=$(jq -r .version apps/cli/package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.image == 'agent-board-backend' && format('CLI_VERSION={0}', steps.cli.outputs.version) || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
