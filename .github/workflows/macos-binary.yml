name: macOS binary

# Builds board-darwin-arm64 on a Mac, runs the smoke tests on that very file and hands it on as the artifact
# board-darwin-arm64. Called by release-cli.yml, twice when GitHub has no macOS runner for the first call.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the macOS binary
        run: pnpm --filter @agent-board/cli build darwin-arm64

      - name: Binary smoke test
        run: BOARD_BINARY="$PWD/apps/cli/dist/board-darwin-arm64" pnpm --filter @agent-board/cli test:binary

      - name: macOS smoke test
        run: apps/cli/scripts/macos-smoke.sh apps/cli/dist/board-darwin-arm64

      - name: Hand the binary to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-darwin-arm64
          path: apps/cli/dist/board-darwin-arm64
          if-no-files-found: error
          # A first attempt cancelled after its upload must not stop the retry from handing on its own file.
          overwrite: true
