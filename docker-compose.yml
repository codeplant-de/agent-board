services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-board-postgres
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
      POSTGRES_DB: board_dev
    ports:
      - '54331:5432'
    volumes:
      - agent-board-pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U board -d board_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent-board-pgdata:
