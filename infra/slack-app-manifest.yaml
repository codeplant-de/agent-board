# The Slack app of the board (docs/operations.md, "The Slack app"). Create it from this file in the Cosuno workspace:
# api.slack.com/apps, "Create New App", "From a manifest". Then generate an app-level token with the scope connections:write
# (SLACK_APP_TOKEN), install the app and copy the Bot User OAuth Token (SLACK_BOT_TOKEN). It answers /board and the message
# shortcut "Send to board". Slack refuses slash commands without a bot user, so the manifest declares one. The app reads the
# bot token only to open the shortcut's form and to read the thread the user picked (conversations.replies, users.info).
# Without SLACK_BOT_TOKEN, /board still works and the shortcut says it is off.
display_information:
  name: Agent Board
  description: Sends task ideas to your agent board.
  background_color: '#1f2937'
features:
  bot_user:
    display_name: Agent Board
    always_online: false
  slash_commands:
    - command: /board
      description: Send a task idea to the agent board, or link your Slack account
      usage_hint: '<task text> | link | unlink | help'
      should_escape: false
  shortcuts:
    - name: Send to board
      type: message
      callback_id: send_to_board
      description: Send this thread to your agent board inbox
oauth_config:
  scopes:
    bot:
      - commands
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
